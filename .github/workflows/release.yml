name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build:
    name: build distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Check that the tag matches the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: Build the wheel and sdist
        run: uv build
      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  artifact:
    name: build the sample data artifact
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Download the wheel and sdist
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Install the released wheel
        run: |
          uv tool install --force dist/*.whl
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build, publish and verify the sample artifact
        run: |
          export LAKEHOUSE_HOME="$RUNNER_TEMP/lakehouse-home"
          lakehouse build
          lakehouse publish --out dist-release
          lakehouse verify dist-release/ecuador-lakehouse-*
      - name: Zip the versioned artifact
        run: |
          cd dist-release
          zip -r "../ecuador-lakehouse-artifact-${GITHUB_REF_NAME}.zip" .
      - name: Upload the artifact zip
        uses: actions/upload-artifact@v7
        with:
          name: data-artifact
          path: ecuador-lakehouse-artifact-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: create the GitHub release
    needs: [build, artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Download the data artifact
        uses: actions/download-artifact@v8
        with:
          name: data-artifact
          path: dist
      - name: Generate release notes from Conventional Commits
        run: uvx git-cliff --latest --strip header -o RELEASE_NOTES.md
      - name: Write checksums
        run: (cd dist && sha256sum -- *) > SHA256SUMS
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md dist/* SHA256SUMS
